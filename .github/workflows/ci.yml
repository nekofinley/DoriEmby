name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'testdata/**'
      - '.uitest/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # 编译目标平台，确保发布用的交叉编译路径不会挂
      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /tmp/doriyamedia ./cmd/doriyamedia
